<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title></title>
    <link href="/static/css/user.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>User: {{ username }}</h1>
    <div id="userdiv" style="display:none;">
      <span style="display:none" id="username">{{ username }}</span>
      <a href="/battle">Battle</a>
      <button onclick="logout()">Logout</button>
      <button onclick="revive()" id="revbtn">Revive</button>
      <p id="dias"></p>
      <p>Get help on stuff in game...</p>
      <select id="category">
        <option selected disabled hidden>Choose a category</option>
        <option value="items">Items</option>
        <option value="effects">Effects</option>
        <option value="armor">Armor</option>
        <option value="sword">Sword</option>
      </select>
      <select id="helps"></select>
      <button onclick="helpsr()">Search</button>
      <br>
      <button onclick="grab()">Submit an error report</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="/static/js/cookiemonster.js"></script>
    <script src="/static/js/user.js"></script>
    <noscript>How are you going to do intense gaming when the website doesn't work? Please, allow Javascript.</noscript>
  </body>
</html>
